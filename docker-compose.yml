services:
  postgres:
    image: postgres:16-alpine
    container_name: achievhub-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: achievhub
    ports:
      - "6110:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d achievhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: achiev-hub.Server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=achievhub;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres};SSL Mode=Disable"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: "achiev-hub.Server"
      Jwt__Audience: "achiev-hub.Client"
      Jwt__ExpiryMinutes: "30"
      SteamApi__ApiKey: ${STEAM_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
