services:
  postgres:
    image: postgres:16-alpine
    container_name: achievhub-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: achievhub
    ports:
      - "6110:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d achievhub"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

