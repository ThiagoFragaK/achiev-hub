services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: achievhub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5672:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d achievhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: achiev-hub.Server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=achievhub;Username=postgres;Password=postgres
      SteamApi__ApiKey: ${STEAM_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
