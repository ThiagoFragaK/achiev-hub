services:
  postgres:
    image: postgres:16-alpine
    container_name: achievhub-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: achievhub
    ports:
      - "6110:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d achievhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: achievhub-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: achiev-hub/achiev-hub.Server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=achievhub;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres};SSL Mode=Disable"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: "achiev-hub.Server"
      Jwt__Audience: "achiev-hub.Client"
      Jwt__ExpiryMinutes: "30"
      SteamApi__ApiKey: ${STEAM_API_KEY}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__Username: ${RABBITMQ_USER:-guest}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-guest}
      RabbitMQ__VirtualHost: /
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  steam-sync-worker:
    build:
      context: ../steam-sync
      dockerfile: Dockerfile
    deploy:
      replicas: 2
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=achievhub;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres};SSL Mode=Disable"
      SteamApi__ApiKey: ${STEAM_API_KEY}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__Username: ${RABBITMQ_USER:-guest}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-guest}
      RabbitMQ__VirtualHost: /
      SyncWorker__Concurrency: "3"
      SyncWorker__NightlyCron: "0 0 * * *"
      Workers__Count: "2"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
